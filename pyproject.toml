[project]
name = "huayu-coach"
version = "0.1.0"
description = "AI 華語學習教練 — a Mandarin coach for A1–A2 learners that diagnoses why they stopped and adjusts the plan only after they confirm."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app"]

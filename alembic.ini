[alembic]
script_location = migrations
# The database URL comes from HUAYU_DATABASE_URL / data dir (see app/config.py), set in migrations/env.py.
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
